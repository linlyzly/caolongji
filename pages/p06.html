<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>草龙记 · 第 7 页 编鳞</title>
<link rel="stylesheet" href="../css/p06.css?v=2026102045">
</head><body>

<div class="stage" id="stage">
  <section id="p7" class="page" data-page="7" data-title="编鳞">
    <img class="p7-art" src="../img/p06_14.jpg" alt="工坊里编草龙">
    <div class="p7-veil"></div>

    <div class="p7-col">
      <header class="p7-topbar">
        <span><i class="bar"></i>鄱阳湖绿色非遗会展季 · 2026</span>
        <span class="p7-seal"><img src="../img/stamp.png" alt=""></span>
      </header>

      <div class="p7-meta">
        <div class="p7-step"><b>工序 二 / 四 · 熟练</b>编 鳞</div>
        <div class="p7-ridge">编</div>
        <h2 class="p7-title"><span>编</span><span>鳞</span></h2>
      </div>

      <div class="p7-fan" id="p7Fan"><i class="p7-whole"></i><button class="p7-tile" data-i="0" data-cn="一" aria-label="第1根麦秆"><i class="tf"></i><i class="tb" style="background-position:0% 0%"></i></button><button class="p7-tile" data-i="1" data-cn="二" aria-label="第2根麦秆"><i class="tf"></i><i class="tb" style="background-position:50% 0%"></i></button><button class="p7-tile" data-i="2" data-cn="三" aria-label="第3根麦秆"><i class="tf"></i><i class="tb" style="background-position:100% 0%"></i></button><button class="p7-tile" data-i="3" data-cn="四" aria-label="第4根麦秆"><i class="tf"></i><i class="tb" style="background-position:0% 50%"></i></button><button class="p7-tile" data-i="4" data-cn="五" aria-label="第5根麦秆"><i class="tf"></i><i class="tb" style="background-position:50% 50%"></i></button><button class="p7-tile" data-i="5" data-cn="六" aria-label="第6根麦秆"><i class="tf"></i><i class="tb" style="background-position:100% 50%"></i></button><button class="p7-tile" data-i="6" data-cn="七" aria-label="第7根麦秆"><i class="tf"></i><i class="tb" style="background-position:0% 100%"></i></button><button class="p7-tile" data-i="7" data-cn="八" aria-label="第8根麦秆"><i class="tf"></i><i class="tb" style="background-position:50% 100%"></i></button><button class="p7-tile" data-i="8" data-cn="九" aria-label="第9根麦秆"><i class="tf"></i><i class="tb" style="background-position:100% 100%"></i></button></div>
      <div class="p7-tap" id="p7Tap"><i class="dot"></i>点一根麦秆</div>
      <div class="p7-panel">
        <div class="p7-done" id="p7Done">编满了。</div>

      <p class="p7-lead">九根，一根一根编进去。手快不得。</p>
      <div class="p7-body">九个算一个单位。编满九根，合拢成一片鳞。<br>这是龙身上最小的一块，也是<em>唯一的一块</em>。</div>
      <p class="p7-fact">九根麦秆编成一片鳞，粗细如一。</p>
      </div>

      <div class="p7-hint"><i class="arr"></i>上滑</div>
    </div>

        <div class="p7-mask" id="p7Mask"></div>
<div class="p7-end" id="p7End">
      <div class="frame"></div>
      <i class="x" id="p7X">✕</i>
      <div class="wrap">
        <div class="cn">熟练</div>
        <div class="rule"></div>
        <div class="say">手上的熟练，是时间堆出来的。</div>
        <div class="cut">没有捷径。</div>
        <div class="last">这是龙身上最小的一块，<br>也是唯一的一块。</div>
      </div>
      <span class="seal"><img src="../img/stamp.png" alt=""></span>
    </div>
  </section>

</div>


<script src="../js/p06.js?v=2026102045"></script>
<script src="../js/bridge.js?v=2026102045"></script>
</body></html>
