<section class="page" id="page2" data-page="2" data-title="一根稻草">
  <img class="art" src="../img/p2_art.jpg" alt="">
  <div class="veil-top"></div><div class="veil-bot"></div>
  <div class="fx-gust"></div><div class="fx-sheen"></div>

  <div class="inner">
    <header class="top">
      <span><i class="dot"></i>鄱阳湖绿色非遗会展季 · 2026</span>
      <span class="seal"><img src="../img/stamp.png" alt=""></span>
    </header>

    <div class="hero">
      <h1 class="titleV"><span>一</span><span>根</span><span>稻</span><span>草</span></h1>
      <div class="frame">
        <div class="pg pg1">
        <p>在成为龙之前，它只是一根稻草。谷子归仓之后，稻草留在田里。烧掉，是最省事的去处——一把火，一阵烟，也就没了。</p>
        <p>湖口人不这么做。<em>他们把它扎成一条龙</em>，正月里抬着它穿村。</p>
      </div>
        <div class="pg pg2">
        <p>中国画里的龙，多是帝王的龙。这一条不是。</p>
        <p>湖口人叫它<em>「谷龙」</em>——「谷」，是稻谷的谷。谷子归仓，稻草扎龙。它从田里来。</p>
      </div>
        <button class="pgbtn" type="button" aria-label="翻页"><span class="btn-txt">下页 ›</span></button>
      <i class="leadline" aria-hidden="true"></i>
      </div>
    </div>

    <div class="tail">
    <div class="foreshadow">
      <span class="fl">记 住 这 个 动 作</span>
      <span class="ft">它最后还是会被烧掉。但那时，灰会回到田里。</span>
    </div>

    <p class="note">秋收之后扎龙，春节至元宵巡游。相传起于隋唐，盛于明清。1986 年编创《草龙舞》入选《中国民族民间舞蹈集成·江西卷》。</p>
