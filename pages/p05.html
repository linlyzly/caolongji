<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>草龙记 · 第 6 页 破秆</title>
<link rel="stylesheet" href="../css/p05.css?v=2026102045">
</head><body>

<div class="stage" id="stage">
  <section id="p6" class="page" data-page="6" data-title="破秆">
    <img class="p6-art" src="../img/p05_09.jpg" alt="麦田落日">
    <div class="p6-topveil"></div>
    <div class="p6-botveil"></div>

    <div class="p6-layer" data-layer>
      <header class="p6-topbar">
        <span><i class="bar"></i>鄱阳湖绿色非遗会展季 · 2026</span>
        <span class="p6-seal"><img src="../img/stamp.png" alt=""></span>
      </header>

      <div class="p6-step"><b>工序一 / 四 · 入门</b>破 秆</div>
      <div class="p6-ridge">破</div>
      <h2 class="p6-title"><span>破</span><span>秆</span></h2>
      <div class="p6-say" id="p6Say">先破一根麦秆。</div>

      <div class="p6-track" id="p6Track">
        <div class="p6-hintline">按住镰刀，往右推</div>
        <div class="p6-rail"></div>
        <div class="p6-done" id="p6Done"></div>
        <div class="p6-glow"></div>
        <div class="p6-sickle" id="p6Sickle"><img src="../img/p05_10.webp" alt="镰刀"></div>
      </div>

      <i class="p6-rule"></i>
      <p class="p6-lead">每个编龙的人，都是从破一根麦秆开始的。</p>
      <p class="p6-fact">一条精编草龙，用刀、钳、锯、锤、针、线等工具，采用编、插、织、嵌、镶、绕、缠、悬、挂、空、别、剔、镂、透等十多种手工技巧。</p>
      <p class="p6-skill">编<i>·</i>插<i>·</i>织<i>·</i>嵌<i>·</i>镶<i>·</i>绕<i>·</i>缠<i>·</i>悬<i>·</i>挂<i>·</i>空<i>·</i>别<i>·</i>剔<i>·</i>镂<i>·</i>透</p>
      <div class="p6-hint"><i class="arr"></i>上滑</div>
    </div>

    <div class="p6-mask" id="p6Mask"></div>
    <div class="p6-pop" id="p6Pop">
      <i class="cn c1"></i><i class="cn c2"></i><i class="cn c3"></i><i class="cn c4"></i>
      <i class="x" id="p6X">✕</i>
      <div class="inner">
        <img class="im" src="../img/p05_11.webp" alt="破开的麦秆">
      <div class="big">破开了</div>
      <div class="sub">一根麦秆从中破开，一分为二。<br>破开，才有可用的两条。<br>这是学徒学的<em>第一件事</em>。</div>
      <div class="bar"></div>
      <span class="seal"><img src="../img/stamp.png" alt=""></span>
        <div class="okwrap"><span class="ok" id="p6Ok">知道了</span></div>
      </div>
    </div>
  </section>

</div>


<script src="../js/p05.js?v=2026102045"></script>
<script src="../js/bridge.js?v=2026102045"></script>
</body></html>
