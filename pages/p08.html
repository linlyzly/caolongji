<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>草龙记 · 第10页 点睛（出师）</title>
<link rel="stylesheet" href="../css/p08.css?v=2026102045">
</head><body>

<div class="page" id="page">
  <img class="bg" id="bgNow" src="../img/p08_24.jpg" alt=""/>
  <img class="bg" id="bgWit" src="../img/p08_25.jpg" alt=""/>

  <header class="top">
    <span class="left"><i></i>鄱阳湖绿色非遗会展季 · 2026</span>
    <span class="seal"><img src="../img/stamp.png" alt=""></span>
  </header>

  <div class="headline">
    <div class="step">工 序 四 / 四 · 出师 — 成器</div>
    <h2>点睛</h2>
  </div>
  <div class="anchor" id="anchor"><span class="ring"></span><span class="ring2"></span><span class="dot"></span></div>

  <div class="bubble" id="bubble">
    <div class="btxt">那只龙还差一笔——</div>
    <div class="btxt2">点<b>它的眼睛</b> · 点睛</div>
    <i class="arrow"></i>
  </div>

  <div class="fade"></div>
  <div class="guide" id="guide">
    <div class="q">龙的眼，还差一笔。</div>
    <div class="op"><b>点它</b> · 点睛</div>
  </div>

  <div class="words" id="words">
    <p>笔尖落下的那一瞬，稻草有了眼睛。</p>
    <p>湖口人说——点了睛，龙才算活。</p>
    <div class="fact">点睛之后，龙才算活。此前是物件，此后是龙。</div>
    <span class="stamp">捌 · 睛</span>
    <span class="tail">— 出师 · 成器 —</span>
  </div>

  <div class="swipe">⌄</div>

  <div class="pop" id="pop">
    <div class="pop-card">
      <div class="pop-head"><span class="t">点睛</span><span class="s">取出毛笔 · <b>擦</b>出龙的眼睛</span></div>
      <div class="stage-wrap" id="wrap">
        <canvas id="cvL"></canvas>
        <canvas id="cvU"></canvas>
        <div class="hint-sway" id="sway"><i>◂</i> 擦到眼睛，龙才会亮 <i>▸</i></div>
      </div>
      <div class="pop-done" id="popDone">
        <span class="sealbig">点睛既成 · 草龙方醒</span>
        <div class="t2">点睛之后，龙才算活。<br/>此前是物件，此后是龙。</div>
        <div class="btn" id="closeBtn">收 下</div>
      </div>
    </div>
  </div>

  <div id="brush" class="brush"><span class="ink"><img src="../img/p08_26.png" alt="毛笔"/></span></div>
</div>
